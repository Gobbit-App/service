name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # One run of both Vitest projects (unit + integration) with the coverage gates.
      - run: pnpm test:coverage

      - run: pnpm --filter @pb/db exec drizzle-kit check

      # Schema ↔ migration drift: the Drizzle schema must not produce a new migration.
      - name: No ungenerated schema changes
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain packages/db/migrations)" || {
            git status --porcelain packages/db/migrations
            echo 'Schema changed without a committed migration (run pnpm db:generate).'
            exit 1
          }

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; metadata-action lowercases the owner/repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Tell Dokploy to pull the new image and restart the Compose project. Skipped until the
      # DOKPLOY_DEPLOY_WEBHOOK secret (the compose service's deploy webhook URL) is set.
      - name: Redeploy on Dokploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo 'DOKPLOY_DEPLOY_WEBHOOK not set; skipping redeploy.'
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
