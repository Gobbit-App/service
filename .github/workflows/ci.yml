name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm test:int

      - run: pnpm test:coverage

      - run: pnpm --filter @pb/db exec drizzle-kit check

  # Builds the API image from this commit, runs it against a throwaway Postgres
  # (the entrypoint applies migrations), seeds it, and runs the @smoke suite.
  smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: infra/docker-compose.yml
      DEV_AUTH_ENABLED: 'true'
      DEV_USER: dev@example.test
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://pb:pb@localhost:5432/pb
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Per-run token for the ephemeral stack; compose passes it to the API container.
      - name: Generate dev token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "DEV_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start stack from this build
        run: docker compose up -d --build --wait --wait-timeout 180

      - run: pnpm db:seed

      - run: pnpm test:e2e --grep @smoke

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report

  image:
    needs: [test, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; metadata-action lowercases the owner/repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
