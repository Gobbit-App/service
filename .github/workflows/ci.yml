name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Pull the Testcontainers images up front, with retries: a Docker Hub hiccup otherwise
      # surfaces as an opaque "HTTP code 500" in the integration global setup, which aborts the
      # whole Vitest run ("No test files found", 0% coverage). Keep in sync with
      # packages/db/test/global-setup.ts and the Ryuk version bundled with testcontainers.
      - name: Pull Testcontainers images
        run: |
          for image in pgvector/pgvector:pg17 testcontainers/ryuk:0.14.0; do
            for attempt in 1 2 3 4; do
              docker pull --quiet "$image" && break
              [ "$attempt" = 4 ] && { echo "::error::docker pull $image failed after 4 attempts"; exit 1; }
              sleep $((attempt * 10))
            done
          done

      # One run of both Vitest projects (unit + integration) with the coverage gates.
      - run: pnpm test:coverage
        env:
          # Surfaces the Docker daemon's own error text if container start-up still fails.
          DEBUG: testcontainers*

      - run: pnpm --filter @pb/db exec drizzle-kit check

      # D53: the committed OpenAPI document and generated client types match the API routes.
      - name: No API client drift
        run: |
          pnpm api:openapi
          test -z "$(git status --porcelain packages/api-client)" || {
            git status --porcelain packages/api-client
            echo 'API routes changed without regenerating the client (run pnpm api:openapi).'
            exit 1
          }

      # D57: the web build succeeds and its initial JS stays within the gzip budget.
      - run: pnpm build:web

      - run: pnpm budget

      # Schema ↔ migration drift: the Drizzle schema must not produce a new migration.
      - name: No ungenerated schema changes
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain packages/db/migrations)" || {
            git status --porcelain packages/db/migrations
            echo 'Schema changed without a committed migration (run pnpm db:generate).'
            exit 1
          }

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    # D51: both images are built from the same commit; smoke checks both report it.
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; metadata-action lowercases the owner/repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # Tell Dokploy to pull the new images and restart the Compose project. Skipped until the
      # DOKPLOY_DEPLOY_WEBHOOK secret (the compose service's deploy webhook URL) is set.
      - name: Redeploy on Dokploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo 'DOKPLOY_DEPLOY_WEBHOOK not set; skipping redeploy.'
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
