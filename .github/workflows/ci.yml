name: CI

on:
  # Branch pushes are covered by pull_request; push only on main (images + deploy).
  push:
    branches: [main]
  pull_request:
  # Manual redeploy (Actions → CI → Run workflow). Builds and deploys only when run on main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip test, image and deploy. The jobs report "skipped", which a required
  # status check treats as passing (trigger-level paths-ignore would leave the check pending).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
      actions: read # gh run list
    outputs:
      # Fail-safe: anything but an explicit 'false' (filter skipped or unsure) runs everything.
      code: ${{ steps.filter.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Push to main: diff against the last commit CI passed on main, not just the previous
      # push, so code from a cancelled or failed run is still tested and deployed.
      - id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --status success --limit 20 --json headSha,event \
            --jq '[.[] | select(.event != "pull_request")][0].headSha // ""')
          echo "Last successful main run: ${sha:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Skipped (→ full run) for manual dispatches and when main has no successful run yet.
      - id: filter
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && steps.base.outputs.sha != '')
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: every
          # Everything except files no build, test or image reads (*.md is prettier-ignored).
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!apps/api/api.http'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Pull the Testcontainers images up front, with retries: a Docker Hub hiccup otherwise
      # surfaces as an opaque "HTTP code 500" in the integration global setup, which aborts the
      # whole Vitest run ("No test files found", 0% coverage). Keep in sync with
      # packages/db/test/global-setup.ts and the Ryuk version bundled with testcontainers.
      - name: Pull Testcontainers images
        run: |
          for image in pgvector/pgvector:pg17 testcontainers/ryuk:0.14.0; do
            for attempt in 1 2 3 4; do
              docker pull --quiet "$image" && break
              [ "$attempt" = 4 ] && { echo "::error::docker pull $image failed after 4 attempts"; exit 1; }
              sleep $((attempt * 10))
            done
          done

      # One run of both Vitest projects (unit + integration) with the coverage gates.
      - run: pnpm test:coverage
        env:
          # Surfaces the Docker daemon's own error text if container start-up still fails.
          DEBUG: testcontainers*

      # D81: search eval (recall@5) from the committed embedding cache; no provider key needed.
      - run: pnpm test:search

      - run: pnpm --filter @pb/db exec drizzle-kit check

      # D53: the committed OpenAPI document and generated client types match the API routes.
      - name: No API client drift
        run: |
          pnpm api:openapi
          test -z "$(git status --porcelain packages/api-client)" || {
            git status --porcelain packages/api-client
            echo 'API routes changed without regenerating the client (run pnpm api:openapi).'
            exit 1
          }

      # D57: the web build succeeds and its initial JS stays within the gzip budget.
      - run: pnpm build:web

      - run: pnpm budget

      # Schema ↔ migration drift: the Drizzle schema must not produce a new migration.
      - name: No ungenerated schema changes
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain packages/db/migrations)" || {
            git status --porcelain packages/db/migrations
            echo 'Schema changed without a committed migration (run pnpm db:generate).'
            exit 1
          }

  # D153: the Playwright @smoke suite against a Compose stack built from this commit (both images,
  # local Postgres, console mailer), so broken journeys fail the PR instead of the deploy.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -p gobbit-e2e -f infra/docker-compose.yml -f infra/docker-compose.local.yml
      # Dummy credentials, never a real account: the specs answer every Cloudinary host with
      # page.route, and sign the fake upload answer with this secret so the API's confirm step
      # (012) verifies it.
      CLOUDINARY_URL: cloudinary://e2e-key:e2e-secret@e2e-cloud
      CLOUDINARY_API_SECRET: e2e-secret
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # docker-compose.yml attaches web to Dokploy's external network; create an empty one.
      - name: Start the stack
        run: |
          docker network create dokploy-network
          $COMPOSE up -d --build --wait --wait-timeout 300

      # The API ran the migrations on boot; the seed adds the owner and a fresh smoke bearer.
      - name: Seed the owner and smoke session
        env:
          DATABASE_URL: postgres://pb:pb@localhost:5432/pb
          SEED_OWNER_EMAIL: owner@example.test
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "SMOKE_SESSION_TOKEN=$token" >> "$GITHUB_ENV"
          SMOKE_SESSION_TOKEN="$token" pnpm db:seed

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - run: pnpm --filter e2e exec playwright test --grep @smoke
        env:
          # The web image serves the app on :8080 and proxies /api to the API (D64).
          BASE_URL: http://localhost:8080/api
          CI: 'true'

      - name: Collect stack logs
        if: failure()
        run: $COMPOSE logs --no-color api worker web > e2e/stack.log 2>&1

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/stack.log

  image:
    # Main deploys only what passed both the test suites and the e2e smoke run.
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    # D51: both images are built from the same commit; smoke checks both report it.
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; metadata-action lowercases the owner/repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # Tell Dokploy to pull the new images and restart the Compose project. Skipped until the
      # DOKPLOY_DEPLOY_WEBHOOK secret (the compose service's deploy webhook URL) is set.
      # The compose service needs Autodeploy enabled, or Dokploy answers 400 ("Automatic
      # deployments are disabled for this compose").
      - name: Redeploy on Dokploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          # Untrusted text (commit message) — passed via env and jq --arg, never inlined into the shell.
          # Empty on workflow_dispatch, which has no head_commit.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_DEPLOY_WEBHOOK:-}" ]; then
            echo 'DOKPLOY_DEPLOY_WEBHOOK not set; skipping redeploy.'
            exit 0
          fi
          echo "::add-mask::$DOKPLOY_DEPLOY_WEBHOOK"

          # What's being released: the head commit's subject (or "Manual redeploy") + short SHA.
          short_sha="${GITHUB_SHA:0:7}"
          subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          [ -n "$subject" ] || subject="Manual redeploy (${GITHUB_ACTOR})"
          title="${subject:0:120} — ${short_sha}"
          images="${IMAGE_REPO,,}/{api,web}:${GITHUB_SHA}"

          {
            echo "### Dokploy deploy"
            echo
            echo "- **Release:** ${title}"
            echo "- **Commit:** [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- **Images:** \`${images}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Dokploy titles a deployment from body.head_commit.message (and shows head_commit.id)
          # when the request carries `X-GitHub-Event: push`; without it every deploy gets
          # a generic title. The Compose service is a raw source, so `ref` is not checked
          # against a branch and the payload never changes what deploys (Compose pulls :latest).
          payload=$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg id "$short_sha" \
            --arg msg "$title" \
            '{ref: $ref, head_commit: {id: $id, message: $msg}}')

          echo "Triggering Dokploy deploy: $title"
          # --fail-with-body: on an HTTP error, print Dokploy's message instead of just the code.
          curl -sS --fail-with-body -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'X-GitHub-Event: push' \
            -H 'Content-Type: application/json' \
            -d "$payload"
          echo
