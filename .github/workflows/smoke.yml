name: Smoke Tests

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    # Targets the deployed API; set the SMOKE_RUNNER repo variable (e.g. 'self-hosted') if it is
    # only reachable from a private runner. Triggered only from main, never by fork PRs.
    runs-on: ${{ vars.SMOKE_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter e2e exec playwright test --grep @smoke
        env:
          BASE_URL: ${{ vars.API_BASE_URL }}
          DEV_API_TOKEN: ${{ secrets.DEV_API_TOKEN }}
          DEV_USER: ${{ secrets.DEV_USER }}
          CI: 'true'

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
