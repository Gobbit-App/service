name: Smoke Tests

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # A docs-only CI run succeeds without deploying; smoke would then wait for a commit that never
  # ships. Only continue when the triggering run's deploy job actually succeeded.
  deployed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.name == "deploy")][0].conclusion // "missing"')
          echo "CI run $RUN_ID deploy job: $conclusion"
          if [ "$conclusion" = success ]; then ok=true; else ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

  smoke:
    needs: deployed
    # Targets the deployed API; set the SMOKE_RUNNER repo variable (e.g. 'self-hosted') if it is
    # only reachable from a private runner. Triggered only from main, never by fork PRs.
    runs-on: ${{ vars.SMOKE_RUNNER || 'ubuntu-latest' }}
    # Skipped until a deployed API is configured via the API_BASE_URL repository variable
    # (https://gobbit.niranhome.win/api, D46).
    if: vars.API_BASE_URL != '' && needs.deployed.outputs.ok == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # D62: the web-smoke project drives Chromium against the deployed web origin.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - run: pnpm --filter e2e exec playwright test --grep @smoke
        env:
          BASE_URL: ${{ vars.API_BASE_URL }}
          # Optional; defaults to API_BASE_URL without its /api suffix (D51).
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          SMOKE_SESSION_TOKEN: ${{ secrets.SMOKE_SESSION_TOKEN }}
          # Optional (012): signs the faked upload answer so the image save smoke runs; skipped without it.
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # Wait until /health and /version.json report the commit CI just built and shipped.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CI: 'true'

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
