name: Smoke Tests

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    # Targets the deployed API; set the SMOKE_RUNNER repo variable (e.g. 'self-hosted') if it is
    # only reachable from a private runner. Triggered only from main, never by fork PRs.
    runs-on: ${{ vars.SMOKE_RUNNER || 'ubuntu-latest' }}
    # Skipped until a deployed API is configured via the API_BASE_URL repository variable
    # (https://gobbit.niranhome.win/api, D46).
    if: >-
      vars.API_BASE_URL != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter e2e exec playwright test --grep @smoke
        env:
          BASE_URL: ${{ vars.API_BASE_URL }}
          SMOKE_SESSION_TOKEN: ${{ secrets.SMOKE_SESSION_TOKEN }}
          # Wait until the deployed /health reports the commit CI just built and shipped.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CI: 'true'

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
