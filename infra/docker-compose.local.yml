# Local overlay for `pnpm compose:up`: builds both images from source, serves the app on
# http://localhost:8080 (the web image proxies /api and /s to the API, D64) and relaxes the
# production defaults of docker-compose.yml for plain HTTP (no Secure cookie, console mailer
# printing sign-in links to `docker compose logs api`). It also adds the local Postgres: the
# deployed host uses a shared database outside the project (D67). Not used on the deployed host.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gobbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gobbit}
      POSTGRES_DB: gobbit
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gobbit -d gobbit']
      interval: 5s
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: gobbit-api:local
    pull_policy: build
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gobbit:${POSTGRES_PASSWORD:-gobbit}@db:5432/gobbit
      # Development lets the API boot without CLOUDINARY_URL (editor image uploads and OG uploads off).
      NODE_ENV: ${NODE_ENV:-development}
      API_URL: ${API_URL:-http://localhost:8080/api}
      APP_URL: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      ALLOW_CONSOLE_MAIL: ${ALLOW_CONSOLE_MAIL:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}

  worker:
    image: gobbit-api:local
    pull_policy: never
    environment:
      DATABASE_URL: postgres://gobbit:${POSTGRES_PASSWORD:-gobbit}@db:5432/gobbit
      NODE_ENV: ${NODE_ENV:-development}
      # The worker shares the API environment (x-api-env); keep its mail settings local too.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      ALLOW_CONSOLE_MAIL: ${ALLOW_CONSOLE_MAIL:-true}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: gobbit-web:local
    pull_policy: build
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:80

  umami:
    # D231: only with `pnpm compose:up -- --profile analytics`; create the `umami` role and
    # database first (specs/031-landing-analytics/quickstart.md §2). Local defaults, not secrets.
    profiles: [analytics]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-postgres://umami:umami@db:5432/umami}
      APP_SECRET: ${UMAMI_APP_SECRET:-local-umami-secret}
      CLIENT_IP_HEADER: ''
    ports:
      - 127.0.0.1:${UMAMI_PORT:-3001}:3000

volumes:
  pgdata:
